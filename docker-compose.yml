services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lacrei_saude
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Hot reload em desenvolvimento
    environment:
      - DJANGO_SETTINGS_MODULE=lacrei_saude.settings.local
      - SECRET_KEY=dev-secret-key-nao-usar-em-producao-lacrei-saude-api-segura
      - DEBUG=True
      - DB_NAME=lacrei_saude
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
