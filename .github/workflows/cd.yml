name: CD — Build & Deploy

on:
  push:
    branches: [main, staging]

jobs:
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      environment: ${{ steps.vars.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir tag da imagem
        id: vars
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHA=$(echo $GITHUB_SHA | head -c 7)
          echo "tag=${BRANCH}-${SHA}" >> $GITHUB_OUTPUT
          echo "environment=${BRANCH}" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t lacrei-saude-api:${{ steps.vars.outputs.tag }} .
      # TODO: Push para registry (ECR/GHCR) quando configurado
      # - name: Push to registry
      #   run: docker push ...

  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Deploy para EC2 Staging
        run: |
          echo "🚀 Deploy para staging..."
          echo "Tag da imagem: ${{ needs.build.outputs.tag }}"
          # TODO: Implementar deploy via SSH para EC2 Staging
          # ssh user@staging-host "cd /app && docker compose -f docker-compose.staging.yml pull && docker compose -f docker-compose.staging.yml up -d"

  deploy-production:
    name: 🚀 Deploy Produção
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy para EC2 Produção (Blue/Green)
        run: |
          echo "🚀 Deploy para produção com estratégia Blue/Green..."
          echo "Tag da imagem: ${{ needs.build.outputs.tag }}"
          # Procedimento Operacional Blue/Green:
          # 1. Deploy do novo container Green em porta isolada (ex: 8001):
          #    docker run -d --name api-green -p 8001:8000 lacrei-saude-api:${{ needs.build.outputs.tag }}
          # 2. Health check interno com retentativas no endpoint /api/v1/health/:
          #    for i in {1..10}; do
          #      curl -f http://localhost:8001/api/v1/health/ && break || (echo "Aguardando inicialização..." && sleep 3)
          #    done
          # 3. Se o health check falhar, acionar Rollback automático:
          #    remover container Green, abortar deploy e manter container Blue em execução sem downtime.
          #    docker stop api-green && docker rm api-green && exit 1
          # 4. Se o health check tiver sucesso, efetuar comutação do Nginx (Switch Blue -> Green):
          #    sed -i 's/api-blue:8000/api-green:8000/' /etc/nginx/conf.d/default.conf && nginx -s reload
          # 5. Descomissionamento seguro do container Blue antigo:
          #    docker stop api-blue && docker rm api-blue
          #    docker rename api-green api-blue
